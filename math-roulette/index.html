<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Family, 공부하고 놀기 | 정상부녀</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero panel">
        <div>
          <p class="brand-name">정상부녀</p>
          <h1>Happy Family, <span>공부하고 놀기</span></h1>
          <p class="hero-guide">선택한 과목의 문제를 룰렛은 연속 5번, 고른 영상은 연속 10번 맞춰야 재생돼요</p>
        </div>
      </section>

      <section class="layout">
        <section class="panel controls">
          <details class="game-settings">
            <summary><span>게임 설정</span> <span class="settings-hint">공부과목, 영상관리, 기기간 동기화를 할 수 있어요</span></summary>
            <div class="manage-actions" role="group" aria-label="관리">
              <button id="subject-button" type="button" aria-haspopup="dialog">공부 과목 선택</button>
              <button id="load-button" type="button">링크 불러오기</button>
              <button id="register-button" type="button" aria-haspopup="dialog">영상 등록/삭제</button>
              <button id="sync-button" type="button" aria-haspopup="dialog">기기 간 동기화</button>
            </div>
            <p id="status" class="status" role="status">유튜브 링크를 두 개 이상 줄바꿈으로 붙여 넣어 주세요.</p>
          </details>
          <p id="server-note" class="server-note" hidden></p>
        </section>

        <dialog id="register-dialog" class="settings-dialog video-library" aria-labelledby="register-title">
          <header class="quiz-header">
            <div class="register-heading">
              <h2 id="register-title">영상 등록하기</h2>
              <button id="save-button" type="button">저장하기</button>
            </div>
            <form method="dialog"><button type="submit" aria-label="닫기">&times;</button></form>
          </header>
          <input id="video-urls" type="hidden" />
          <form id="video-add-form" hidden>
            <label for="new-video-url">유튜브 영상 URL</label>
            <input id="new-video-url" type="url" required placeholder="https://youtu.be/..." />
            <div class="actions"><button type="submit" class="accent">추가</button><button id="cancel-video-add" type="button">취소</button></div>
          </form>
          <div id="registered-videos" class="video-options"></div>

          <p id="register-status" class="status" role="status"></p>
        </dialog>
        <dialog id="sync-dialog" class="settings-dialog" aria-labelledby="sync-title">
          <header class="quiz-header">
            <h2 id="sync-title">기기 간 동기화</h2>
            <form method="dialog"><button type="submit" aria-label="닫기">&times;</button></form>
          </header>
              <form id="family-join" class="family-controls">
                <label for="family-code">가족 코드</label>
                <input id="family-code" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" />
                <button id="family-create" class="accent" type="button">새 가족 코드 만들기</button>
                <button id="family-connect" type="submit">코드 입력하고 연결하기</button>
              </form>
              <div id="family-connected" class="family-controls" hidden>
                <label for="family-active-code">내 가족 코드</label>
                <input id="family-active-code" type="text" readonly spellcheck="false" />
                <button id="family-copy" type="button">코드 복사</button>
                <button id="family-disconnect" type="button">이 기기 연결 해제</button>
              </div>
              <p id="family-status" class="status" role="status"></p>
        </dialog>

        <section class="panel player-panel">
          <div class="player-head">
            <div>
              <div class="player-meta">
                <p class="winner-label">Now Playing</p>
                <span id="video-count" role="status" hidden></span>
                <p id="playback-status" class="playback-status" role="status"></p>
              </div>
            </div>
            <div class="play-actions player-actions" role="group" aria-label="게임">
              <button id="spin-button" class="accent" type="button" disabled>룰렛 돌리기</button>
              <button id="pick-button" type="button" disabled>영상 골라 보기</button>
            </div>
          </div>

          <div class="player-wrap">
            <div class="player-screen">
              <iframe
                id="player-frame"
                title="YouTube player"
                src="about:blank"
                allow="autoplay; encrypted-media; picture-in-picture"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </section>

        <section class="panel stage">
          <div class="roulette-shell">
            <div class="roulette-marker" aria-hidden="true"></div>
            <div id="roulette-strip" class="roulette-strip"></div>
          </div>
        </section>
      </section>
    </main>

    <dialog id="video-picker" class="settings-dialog video-library" aria-labelledby="picker-title">
      <header class="quiz-header">
        <h2 id="picker-title">보고 싶은 영상</h2>
        <button id="picker-close" type="button" aria-label="영상 선택 닫기" title="영상 선택 닫기">&times;</button>
      </header>
      <div id="video-options" class="video-options"></div>
    </dialog>

    <dialog id="subject-dialog" class="settings-dialog" aria-labelledby="subject-title">
      <form method="dialog" id="subject-form">
        <header class="quiz-header"><h2 id="subject-title">공부 과목 선택</h2></header>
        <fieldset class="subject-options subject-picker">
          <legend>과목</legend>
          <div class="subject-buttons">
            <label><input type="radio" name="operation" value="addition" checked /><span>덧셈</span></label>
            <label><input type="radio" name="operation" value="subtraction" /><span>뺄셈</span></label>
            <label><input type="radio" name="operation" value="multiplication" /><span>곱셈</span></label>
            <label><input type="radio" name="operation" value="division" /><span>나눗셈</span></label>
          </div>
        </fieldset>
        <fieldset class="subject-options" id="addition-options">
          <legend>덧셈 규칙</legend>
          <label><input type="checkbox" role="switch" name="sumTen" checked /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 합이 10 이하</label>
          <label><input type="checkbox" role="switch" name="addFive" checked /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 두 수가 각각 5 이하</label>
        </fieldset>
        <fieldset class="subject-options" id="subtraction-options" hidden>
          <legend>뺄셈 규칙</legend>
          <label><input type="checkbox" role="switch" name="subtractTen" /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 두 수가 각각 10 이하</label>
          <label><input type="checkbox" role="switch" name="subtractFive" checked /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 두 수가 각각 5 이하</label>
        </fieldset>
        <fieldset class="subject-options" id="multiplication-options" hidden>
          <legend>곱셈 규칙</legend>
          <label><input type="checkbox" role="switch" name="timesTable" /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 구구단 하기</label>
          <label id="table-options" hidden>연습할 단
            <select name="table">
              <option value="2">2단</option><option value="3">3단</option><option value="4">4단</option><option value="5">5단</option>
              <option value="6">6단</option><option value="7">7단</option><option value="8">8단</option><option value="9">9단</option>
            </select>
          </label>
          <label><input type="checkbox" role="switch" name="multiplyTen" checked /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 두 수가 각각 10 이하</label>
        </fieldset>
        <fieldset class="subject-options" id="division-options" hidden>
          <legend>나눗셈 규칙</legend>
          <label><input type="checkbox" role="switch" name="divideTen" checked /> <span class="switch-state" aria-hidden="true"><span>OFF</span><span>ON</span></span> 두 수가 각각 10 이하</label>
        </fieldset>
        <div class="actions">
          <button type="submit" value="save" class="accent">적용</button>
          <button type="submit" value="cancel">취소</button>
        </div>
      </form>
    </dialog>

    <dialog id="math-quiz" aria-labelledby="quiz-title">
      <header class="quiz-header">
        <h2 id="quiz-title">덧셈 퀴즈</h2>
        <button id="quiz-close" type="button" aria-label="퀴즈 닫기" title="퀴즈 닫기">&times;</button>
      </header>
      <p id="quiz-progress" class="quiz-progress"></p>
      <div class="quiz-question">
        <p id="quiz-equation"></p>
        <span id="quiz-mark" class="quiz-mark" aria-hidden="true" hidden></span>
      </div>
      <fieldset id="quiz-answers" class="quiz-answers" aria-labelledby="quiz-equation"></fieldset>
      <p id="quiz-feedback" class="quiz-feedback" role="status"></p>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
